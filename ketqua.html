<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kết Quả Thi</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* CSS bổ sung riêng cho bảng dữ liệu */
        .table-wrapper { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 12px 15px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f1f5f9; color: #1e293b; font-weight: bold; }
        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #e2e8f0; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .action-bar button { width: auto; padding: 10px 20px; margin-left: 10px; }
        .btn-export { background-color: #17a2b8; }
        .btn-export:hover { background-color: #138496; }
        .btn-refresh { background-color: #6c757d; }
        .btn-refresh:hover { background-color: #5a6268; }
        .score-high { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1000px; margin-top: 40px;">
        <h2>BẢNG THỐNG KÊ KẾT QUẢ THI</h2>
        
        <div class="action-bar">
            <div>
                <a href="admin.html" style="text-decoration: none; color: #007bff;">&larr; Về trang Upload Đề</a>
            </div>
            <div>
                <!-- Nút tải lại trang để làm mới dữ liệu -->
                <button onclick="fetchResults()" class="btn-refresh">Tải lại trang</button>
                <button onclick="exportTableToExcel('ThongKeKetQuaThi')" class="btn-export">Xuất file Excel</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Họ và tên</th>
                        <th>Năm sinh</th>
                        <th>Trường</th>
                        <th>Điểm số</th>
                        <th>Câu đúng</th>
                        <th>Thời gian nộp</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="7" style="text-align: center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Nhớ thay bằng tên miền Viettel của bạn
        const API_URL = "https://xabinhhung.gov.vn/api_tracnghiem"; 

        // Hàm gọi API lấy dữ liệu và hiển thị lên bảng
        function fetchResults() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Đang làm mới dữ liệu...</td></tr>';

            fetch(`${API_URL}/api_get_results.php`)
                .then(response => response.json())
                .then(res => {
                    if (res.status === "success") {
                        const data = res.data;
                        tbody.innerHTML = "";

                        if(data.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Chưa có thí sinh nào làm bài.</td></tr>';
                            return;
                        }

                        data.forEach((row, index) => {
                            let scoreClass = row.score >= 5 ? 'score-high' : '';
                            let html = `
                                <tr>
                                    <td>${index + 1}</td>
                                    <td>${row.full_name}</td>
                                    <td>${row.birth_year}</td>
                                    <td>${row.school}</td>
                                    <td class="${scoreClass}">${row.score}</td>
                                    <td>${row.correct_count}</td>
                                    <td>${row.submitted_at}</td>
                                </tr>
                            `;
                            tbody.innerHTML += html;
                        });
                    }
                })
                .catch(error => {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: red;">Lỗi kết nối tới Server!</td></tr>';
                });
        }

        // Tự động tải dữ liệu khi mở trang
        window.onload = fetchResults;

        // Thuật toán xuất bảng HTML ra file Excel (.csv) hỗ trợ tiếng Việt (BOM)
        function exportTableToExcel(filename) {
            let csv = [];
            let rows = document.querySelectorAll("table tr");
            
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                
                for (let j = 0; j < cols.length; j++) {
                    // Dọn dẹp dữ liệu để không bị lỗi dấu phẩy trong nội dung
                    let data = cols[j].innerText.replace(/"/g, '""');
                    row.push('"' + data + '"');
                }
                csv.push(row.join(","));
            }

            // Gắn BOM (\uFEFF) để Excel nhận diện đúng tiếng Việt UTF-8
            let csvFile = new Blob(["\uFEFF" + csv.join("\n")], {type: "text/csv;charset=utf-8;"});
            
            // Tạo link tải file ảo
            let downloadLink = document.createElement("a");
            downloadLink.download = filename + ".csv";
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
