<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thi Trắc Nghiệm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <!-- Màn hình 1: Ghi danh -->
    <div id="register-screen">
        <h2>ĐĂNG KÝ VÀO THI</h2>
    <div class="form-group">
    <label>Họ và tên</label>
    <input type="text" id="full_name" placeholder="Ví dụ: Nguyễn Văn A" onblur="this.value = this.value.replace(/\s+/g, ' ').trim()">
    </div>
        <div class="form-group"><label>Năm sinh</label><input type="number" id="birth_year" placeholder="Ví dụ: 2005"></div>
        <div class="form-group"><label>Trường</label><input type="text" id="school" placeholder="Ví dụ: THPT Nguyễn Trãi"></div>
        <button onclick="startExam()">Bắt đầu thi</button>
    </div>

    <!-- Màn hình 2: Làm bài thi -->
    <div id="exam-screen" class="hidden">
        <div class="timer" id="timer-display">05:00</div>
        <div style="clear: both;"></div>
        <h2>BÀI THI TRẮC NGHIỆM</h2>
        <div id="quiz-container"></div>
        <button onclick="submitExam()" class="btn-success">Nộp bài</button>
    </div>

    <!-- Màn hình 3: Kết quả -->
    <div id="result-screen" class="hidden">
        <h2>KẾT QUẢ BÀI THI</h2>
        <div id="result-content" style="text-align: center; font-size: 18px; line-height: 1.8;"></div>
   
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
