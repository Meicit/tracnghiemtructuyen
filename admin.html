<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Upload Đề Thi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container" style="max-width: 600px; margin-top: 40px;">
        <h2>Upload Ngân Hàng Câu Hỏi (.docx)</h2>
        
        <div class="form-group">
            <label>Chọn file Word (chứa các chuyên đề và câu hỏi):</label>
            <input type="file" id="wordFile" accept=".docx">
        </div>
        
        <button onclick="uploadFile()" class="btn-success">Import vào Database</button>
        <p id="status"></p>
        <br>
        <a href="ketqua.html" style="display: block; text-align: center; color: #007bff; text-decoration: none; font-weight: bold;">
        &rarr; Đi tới Bảng thống kê kết quả thi
        </a>
    </div>

    <!-- Script gọi thẳng lên API Viettel -->
    <script>
        function uploadFile() {
            let file = document.getElementById('wordFile').files[0];
            if (!file) { alert("Vui lòng chọn file Word!"); return; }

            let formData = new FormData();
            formData.append("word_file", file);

            document.getElementById('status').innerText = "Đang xử lý dữ liệu... Vui lòng chờ!";

            // Thay bằng domain Viettel của bạn
            fetch("https://xabinhhung.gov.vn/api_tracnghiem/api_upload.php", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').innerText = data.message;
            })
            .catch(error => {
                document.getElementById('status').innerText = "Lỗi kết nối tới Server!";
            });
        }
    </script>
</body>
</html>
